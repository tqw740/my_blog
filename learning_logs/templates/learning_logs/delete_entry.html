{% extends "learning_logs/base.html" %}

{% block title %}删除笔记 · 学习笔记{% endblock title %}

{% block page_header %}
<h1 class="h2 mb-4">删除笔记</h1>
{% endblock page_header %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-danger shadow-sm">
            <div class="card-body text-center p-4">
                <div class="fs-1 mb-3">⚠️</div>
                <h4 class="text-danger mb-3">确定要删除这条笔记吗？</h4>

                <div class="alert alert-secondary text-start entry-text">
                    {{ entry.text|truncatechars:200 }}
                </div>
                <p class="text-muted small">该操作无法恢复。</p>

                <div class="mt-4 d-flex justify-content-center gap-2">
                    <form method="post" action="{% url 'learning_logs:delete_entry' entry.id %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger px-4">确认删除</button>
                    </form>
                    <a href="{% url 'learning_logs:topic_detail' entry.topic.owner.username entry.topic.get_full_path %}"
                       class="btn btn-outline-secondary px-4">取消</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
