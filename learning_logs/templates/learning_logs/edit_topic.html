{% extends "learning_logs/base.html" %}
{% load django_bootstrap5 %}

{% block page_header %}
    <h1 class="h2">Edit Topic</h1>
{% endblock page_header %}

{% block content %}
    <div class="row">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form action="{% url 'learning_logs:edit_topic' topic.id %}" method="post">
                        {% csrf_token %}
                        {% bootstrap_form form %}
                        
                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <button name="submit" class="btn btn-primary">Save changes</button>
                            <a href="{% url 'learning_logs:topics' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
