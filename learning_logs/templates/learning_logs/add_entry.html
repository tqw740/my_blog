{% extends "learning_logs/base.html" %}

{% block title %}新增笔记 · 学习笔记{% endblock title %}

{% block page_header %}
<h1 class="h2 mb-4">在「{{ topic.text }}」下新增笔记</h1>
{% endblock page_header %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-9">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form method="post" id="entry-form"
                      action="{% url 'learning_logs:add_entry' topic.owner.username topic.get_full_path %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_title" class="form-label">笔记标题</label>
                        <input type="text" class="form-control" id="id_title" name="title"
                               maxlength="200" required placeholder="例如：Django ORM 查询总结">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">笔记内容（Markdown · 所见即所得）</label>
                        {% include "learning_logs/_vditor_editor.html" %}
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">保存笔记</button>
                        <a href="{% url 'learning_logs:topic_detail' topic.owner.username topic.get_full_path %}"
                           class="btn btn-outline-secondary px-4">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
