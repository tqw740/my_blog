{% extends "learning_logs/base.html" %}
{% load django_bootstrap5 %}

{% block page_header %}
    <!-- 面包屑导航：清晰定位 Topics -> 当前主题 -> 编辑条目 -->
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-2">
            <li class="breadcrumb-item">
                <a href="{% url 'learning_logs:topics' %}">Topics</a>
            </li>
            <li class="breadcrumb-item">
                <a href="{% url 'learning_logs:topic' topic.id %}">{{ topic }}</a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">Edit Entry</li>
        </ol>
    </nav>

    <h1 class="h2">Edit Entry</h1>
{% endblock page_header %}

{% block content %}
    <div class="row">
        <!-- 保持与添加条目一致的舒适宽度 -->
        <div class="col-md-10 col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    
                    <form action="{% url 'learning_logs:edit_entry' entry.id %}" method="post">
                        {% csrf_token %}
                        
                        <!-- 自动套用 Bootstrap 样式的表单控件 -->
                        {% bootstrap_form form %}

                        <!-- 底部按钮区 -->
                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <button name="submit" class="btn btn-primary">
                                Save changes
                            </button>
                            <!-- 取消编辑，直接返回当前主题详情页 -->
                            <a href="{% url 'learning_logs:topic' topic.id %}" class="btn btn-outline-secondary">
                                Cancel
                            </a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
{% endblock content %}
