{% extends "learning_logs/base.html" %}

{% block title %}编辑笔记 · 学习笔记{% endblock title %}

{% block page_header %}
<h1 class="h2 mb-4">编辑笔记（{{ entry.topic.text }}）</h1>
{% endblock page_header %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form method="post" action="{% url 'learning_logs:edit_entry' entry.id %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_title" class="form-label">笔记标题</label>
                        <input type="text" class="form-control" id="id_title" name="title"
                               maxlength="200" required value="{{ entry.title }}">
                    </div>
                    <div class="mb-3">
                        <label for="id_text" class="form-label">笔记内容</label>
                        <textarea class="form-control" id="id_text" name="text"
                                  rows="10" required>{{ entry.text }}</textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">保存修改</button>
                        <a href="{% url 'learning_logs:topic_detail' entry.topic.owner.username entry.topic.get_full_path %}"
                           class="btn btn-outline-secondary px-4">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
