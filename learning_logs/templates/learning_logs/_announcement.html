<!-- ==================== 顶部通告栏 开始 ==================== -->
<div id="top-announcement-bar" class="announcement-bar" style="display: none;">
  <div class="announcement-container">
    <div class="announcement-content">
      <span class="announcement-icon">📢</span>
      <span class="announcement-text">
        动态博客制作暂时停止，目前已经到了可以正常使用的阶段，后续可能会更新其他功能
      </span>
    </div>
    <!-- 移除了 onclick，改用 id 绑定，绝对不会报错 -->
    <button id="announcement-close-btn" class="announcement-close" aria-label="关闭通告">
      &times;
    </button>
  </div>
</div>

<script>
  (function initAnnouncement() {
    const CURRENT_BANNER_ID = '2026-09-12';
    const bar = document.getElementById('top-announcement-bar');
    const closeBtn = document.getElementById('announcement-close-btn');

    if (!bar) return;

    // 1. 检查是否需要展示（加入 try-catch 防止无痕模式禁用 localStorage 报错）
    try {
      const isClosed = localStorage.getItem('closed_announcement_id');
      if (isClosed !== CURRENT_BANNER_ID) {
        bar.style.display = 'block';
      }
    } catch (e) {
      // 如果无痕模式完全禁用了 localStorage，默认正常显示
      bar.style.display = 'block';
    }

    // 2. 绑定关闭按钮点击事件
    if (closeBtn) {
      closeBtn.addEventListener('click', function () {
        bar.style.display = 'none';
        try {
          localStorage.setItem('closed_announcement_id', CURRENT_BANNER_ID);
        } catch (e) {}
      });
    }
  })();
</script>
<!-- ==================== 顶部通告栏 结束 ==================== -->
